# On a v* tag push: publishes to npm, then creates a GitHub Release. npm auth is trusted publishing (OIDC): no token is stored.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write          # create the GitHub Release
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest        # trusted publishing needs npm 11.5.1+
      - name: Tag matches package.json version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm test
      - run: npm publish
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
